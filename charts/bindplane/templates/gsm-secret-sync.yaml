{{- /*
Google Secret Manager (GSM) integration for GKE. Rendered when gsm.enabled and
gsm.secretsync.enabled are true.

The GKE Secret Sync controller creates (and owns) a Kubernetes Secret with the
same name as this SecretSync. The name defaults to config.secret so the chart's
existing secret references read the synced values.
*/ -}}
{{- if and (.Values.gsm).enabled ((.Values.gsm).secretsync).enabled }}
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: {{ include "bindplane.gsm.syncName" . | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "bindplane.name" . }}
    app.kubernetes.io/stack: bindplane
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  serviceAccountName: {{ include "bindplane.gsm.serviceAccountName" . | quote }}
  secretProviderClassName: {{ include "bindplane.gsm.spcName" . | quote }}
  secretObject:
    type: {{ .Values.gsm.secretsync.secretObject.type | quote }}
    data:
      {{- range .Values.gsm.secretsync.secretObject.data }}
      - sourcePath: {{ .sourcePath | quote }}
        targetKey: {{ .targetKey | quote }}
      {{- end }}
{{- end }}
