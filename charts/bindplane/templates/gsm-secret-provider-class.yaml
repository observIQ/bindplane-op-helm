{{- /*
Google Secret Manager (GSM) integration for GKE. Rendered when gsm.enabled is true.
Requires GKE Secret Sync (GKE 1.33+, --enable-secret-sync) and Workload Identity
Federation for GKE. See docs/example/gke-secret-manager.
*/ -}}
{{- include "bindplane.gsm.validate" . -}}
{{- if .Values.gsm.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "bindplane.gsm.spcName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "bindplane.name" . }}
    app.kubernetes.io/stack: bindplane
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  provider: gke
  parameters:
    secrets: |
      {{- range .Values.gsm.spc.secrets }}
      - resourceName: {{ printf "projects/%s/secrets/%s/versions/%s" $.Values.gsm.projectId .secretName (toString (.version | default "latest")) | quote }}
        path: {{ .path | quote }}
      {{- end }}
{{- end }}
